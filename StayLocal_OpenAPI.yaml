openapi: 3.0.3
info:
  title: StayLocal Backend API
  version: 1.0.0
  description: Contract-first REST API for the StayLocal community tourism platform.
    Covers authentication, destinations, properties, media, camera+GPS verification,
    bookings, rewards, reviews and admin moderation.
  contact:
    name: StayLocal Project Team
    email: staylocal-team@example.com
servers:
- url: http://localhost:8787
  description: Local development
- url: http://localhost:8787
  description: Demo/CI default
tags:
- name: Auth
  description: Registration and authentication
- name: Destinations
  description: Seeded destination catalog
- name: Properties
  description: Property discovery and host listing management
- name: Media
  description: Photo upload and asset attachment
- name: Verification
  description: Camera + GPS property verification
- name: Bookings
  description: Booking lifecycle and printable vouchers
- name: Rewards
  description: ₹100 StayLocal reward coupons
- name: Reviews
  description: Tourist reviews
- name: Admin
  description: Host and property moderation
paths:
  /api/v1/auth/register:
    post:
      operationId: registerUser
      summary: Register a StayLocal user
      description: Creates a tourist or host account. Admin accounts are provisioned
        outside public registration. Duplicate email addresses are rejected.
      tags:
      - Auth
      security: &id001 []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - fullName
              - role
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 120
                phone:
                  type: string
                  maxLength: 20
                  nullable: true
                role:
                  type: string
                  enum:
                  - TOURIST
                  - HOST
            examples:
              201_register_success:
                value:
                  email: newtourist@staylocal.demo
                  password: DemoPass123!
                  fullName: Neha Kulkarni
                  phone: '+919800001111'
                  role: TOURIST
              422_register_invalid_role:
                value:
                  email: newtourist@staylocal.demo
                  password: DemoPass123!
                  fullName: Neha Kulkarni
                  role: ADMIN
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                201_register_success:
                  value: &id002
                    accessToken: eyJhbGciOiJIUzI1NiJ9.demo
                    expiresInSeconds: 3600
                    user:
                      id: 10000000-0000-4000-8000-000000000001
                      email: tourist@staylocal.demo
                      fullName: Aarav Sharma
                      role: TOURIST
                      createdAt: '2026-09-28T12:00:00Z'
        '400':
          description: Malformed JSON request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                400_register_bad_json:
                  value:
                    code: BAD_REQUEST
                    message: Malformed JSON request.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '409':
          description: Email is already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                409_register_duplicate_email:
                  value:
                    code: EMAIL_ALREADY_EXISTS
                    message: Email is already registered.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                422_register_invalid_role:
                  value:
                    code: VALIDATION_ERROR
                    message: Request validation failed.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                500_register_server_error:
                  value:
                    code: INTERNAL_ERROR
                    message: Unexpected server error.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
  /api/v1/auth/login:
    post:
      operationId: loginUser
      summary: Authenticate a user
      description: Validates credentials and returns a bearer access token. Invalid
        credentials do not reveal whether an email exists.
      tags:
      - Auth
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
            examples:
              200_login_success:
                value:
                  email: tourist@staylocal.demo
                  password: DemoPass123!
              401_login_invalid_credentials:
                value:
                  email: tourist@staylocal.demo
                  password: WrongPass123!
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                200_login_success:
                  value: *id002
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                401_login_invalid_credentials:
                  value:
                    code: INVALID_CREDENTIALS
                    message: Invalid email or password.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                422_login_validation:
                  value:
                    code: VALIDATION_ERROR
                    message: Request validation failed.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '429':
          description: Too many login attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                429_login_rate_limited:
                  value:
                    code: RATE_LIMITED
                    message: Too many login attempts.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                500_login_server_error:
                  value:
                    code: INTERNAL_ERROR
                    message: Unexpected server error.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current session user
      description: Returns the authenticated user and active role.
      tags:
      - Auth
      security: &id003
      - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                200_me_success:
                  value: &id008
                    id: 10000000-0000-4000-8000-000000000001
                    email: tourist@staylocal.demo
                    fullName: Aarav Sharma
                    phone: '+919876543210'
                    role: TOURIST
                    createdAt: '2026-09-28T12:00:00Z'
        '401':
          description: Authentication token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                401_me_unauthorized:
                  value:
                    code: UNAUTHORIZED
                    message: Authentication token is missing or invalid.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                500_me_server_error:
                  value:
                    code: INTERNAL_ERROR
                    message: Unexpected server error.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      summary: Logout current user
      description: Revokes the current refresh/session state where applicable. Access
        tokens naturally expire.
      tags:
      - Auth
      security: *id003
      responses:
        '204':
          description: Logged out successfully.
        '401':
          description: Authentication token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                401_logout_unauthorized:
                  value:
                    code: UNAUTHORIZED
                    message: Authentication token is missing or invalid.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
  /api/v1/destinations:
    get:
      operationId: listDestinations
      summary: List StayLocal destinations
      description: Returns the four seeded destinations used by the project demo.
      tags:
      - Destinations
      security: *id001
      responses:
        '200':
          description: Destination list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Destination'
              examples:
                200_destinations_success:
                  value:
                  - &id004
                    id: dest-bhimashankar
                    name: Bhimashankar
                    slug: bhimashankar
                    latitude: 19.0729
                    longitude: 73.5358
                    description: Forest, temple and nature-focused destination.
                    imageUrl: https://example.com/bhimashankar.jpg
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                500_destinations_server_error:
                  value:
                    code: INTERNAL_ERROR
                    message: Unexpected server error.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
  /api/v1/destinations/{destinationId}:
    get:
      operationId: getDestination
      summary: Get a destination
      description: Returns a single destination by ID.
      tags:
      - Destinations
      security: *id001
      parameters:
      - name: destinationId
        in: path
        required: true
        schema:
          type: string
          minLength: 3
          maxLength: 80
        examples:
          200_destination_bhimashankar:
            value: dest-bhimashankar
          404_destination_missing:
            value: dest-missing
      responses:
        '200':
          description: Destination found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Destination'
              examples:
                200_destination_bhimashankar:
                  value: *id004
        '404':
          description: Destination not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                404_destination_missing:
                  value:
                    code: NOT_FOUND
                    message: Destination not found.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '422':
          description: Destination ID is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                422_destination_invalid_id:
                  value:
                    code: VALIDATION_ERROR
                    message: Destination ID is invalid.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
  /api/v1/properties:
    get:
      operationId: listProperties
      summary: Search approved properties
      description: Returns public, approved listings with price and destination filters
        and optional date availability filtering. Results are paginated.
      tags:
      - Properties
      security: *id001
      parameters:
      - name: destinationId
        in: query
        required: false
        schema:
          type: string
        examples:
          200_properties_filtered:
            value: dest-bhimashankar
      - name: minPrice
        in: query
        required: false
        schema:
          type: number
          minimum: 0
        examples:
          200_properties_filtered:
            value: 1000
      - name: maxPrice
        in: query
        required: false
        schema:
          type: number
          minimum: 0
        examples:
          200_properties_filtered:
            value: 3000
      - name: checkIn
        in: query
        required: false
        schema:
          type: string
          format: date
        examples:
          200_properties_available:
            value: '2026-10-10'
      - name: checkOut
        in: query
        required: false
        schema:
          type: string
          format: date
        examples:
          200_properties_available:
            value: '2026-10-12'
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        examples:
          200_properties_paged:
            value: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 12
        examples:
          200_properties_paged:
            value: 12
      responses:
        '200':
          description: Property results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProperties'
              examples:
                200_properties_filtered:
                  value:
                    items:
                    - &id005
                      id: prop-1001
                      hostId: host-1001
                      destinationId: dest-bhimashankar
                      title: Forest View Local Homestay
                      description: Simple private room with a local host near Bhimashankar.
                      pricePerNight: 1800
                      maxGuests: 3
                      amenities:
                      - Wi-Fi
                      - Parking
                      - Hot Water
                      photos: []
                      status: APPROVED
                      latitude: 19.0731
                      longitude: 73.5356
                      locationVerified: true
                      verification: null
                      createdAt: '2026-09-20T09:00:00Z'
                      updatedAt: '2026-09-20T09:00:00Z'
                    page: 1
                    pageSize: 12
                    total: 1
        '422':
          description: One or more search parameters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                422_properties_invalid_filter:
                  value:
                    code: VALIDATION_ERROR
                    message: One or more search parameters are invalid.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '429':
          description: Request rate exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                429_properties_rate_limited:
                  value:
                    code: RATE_LIMITED
                    message: Request rate exceeded.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                500_properties_server_error:
                  value:
                    code: INTERNAL_ERROR
                    message: Unexpected server error.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
    post:
      operationId: createProperty
      summary: Create a room listing
      description: Creates a draft listing for an approved host. A non-approved host
        cannot publish or submit a listing.
      tags:
      - Properties
      security: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - destinationId
              - title
              - description
              - pricePerNight
              - maxGuests
              - latitude
              - longitude
              properties:
                destinationId:
                  type: string
                title:
                  type: string
                  minLength: 3
                  maxLength: 160
                description:
                  type: string
                  minLength: 20
                  maxLength: 5000
                pricePerNight:
                  type: number
                  minimum: 1
                  maximum: 100000
                maxGuests:
                  type: integer
                  minimum: 1
                  maximum: 20
                amenities:
                  type: array
                  items:
                    type: string
                  maxItems: 30
                latitude:
                  type: number
                  minimum: -90
                  maximum: 90
                longitude:
                  type: number
                  minimum: -180
                  maximum: 180
            examples:
              201_property_create_success:
                value:
                  destinationId: dest-bhimashankar
                  title: Forest View Local Homestay
                  description: Simple private room with a local host near Bhimashankar.
                  pricePerNight: 1800
                  maxGuests: 3
                  amenities:
                  - Wi-Fi
                  - Parking
                  - Hot Water
                  latitude: 19.0731
                  longitude: 73.5356
              422_property_create_invalid_price:
                value:
                  destinationId: dest-bhimashankar
                  title: Bad Property
                  description: This description is long enough for validation.
                  pricePerNight: 0
                  maxGuests: 3
                  latitude: 19.0731
                  longitude: 73.5356
      responses:
        '201':
          description: Property created as DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
              examples:
                201_property_create_success:
                  value: *id005
        '401':
          description: Authentication token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                401_property_create_unauthorized:
                  value:
                    code: UNAUTHORIZED
                    message: Authentication token is missing or invalid.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '403':
          description: Only an approved host can create listings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                403_property_create_forbidden:
                  value:
                    code: FORBIDDEN
                    message: Only an approved host can create listings.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                422_property_create_invalid_price:
                  value:
                    code: VALIDATION_ERROR
                    message: Request validation failed.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                500_property_create_server_error:
                  value:
                    code: INTERNAL_ERROR
                    message: Unexpected server error.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
  /api/v1/properties/{propertyId}:
    get:
      operationId: getProperty
      summary: Get property details
      description: Returns a property, host-facing verification information, and public
        photos. Rejected/inactive properties are hidden from public users.
      tags:
      - Properties
      security: *id001
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
        examples:
          200_property_details:
            value: prop-1001
          404_property_missing:
            value: prop-missing
      responses:
        '200':
          description: Property found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
              examples:
                200_property_details:
                  value: *id005
        '404':
          description: Property not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                404_property_missing:
                  value:
                    code: NOT_FOUND
                    message: Property not found.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
    patch:
      operationId: updateProperty
      summary: Edit a room listing
      description: Updates a host-owned listing. Changes to material listing data
        reset approval to PENDING so the admin can review the new state.
      tags:
      - Properties
      security: *id003
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
        examples:
          200_property_update_success:
            value: prop-1001
          404_property_update_missing:
            value: prop-missing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 160
                description:
                  type: string
                  minLength: 20
                  maxLength: 5000
                pricePerNight:
                  type: number
                  minimum: 1
                  maximum: 100000
                maxGuests:
                  type: integer
                  minimum: 1
                  maximum: 20
                amenities:
                  type: array
                  items:
                    type: string
            examples:
              200_property_update_success:
                value:
                  pricePerNight: 1900
                  maxGuests: 3
              422_property_update_invalid:
                value:
                  pricePerNight: 0
      responses:
        '200':
          description: Property updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Property'
              examples:
                200_property_update_success:
                  value: *id005
        '401':
          description: Authentication token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                401_property_update_unauthorized:
                  value:
                    code: UNAUTHORIZED
                    message: Authentication token is missing or invalid.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '403':
          description: User does not own the property.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                403_property_update_forbidden:
                  value:
                    code: FORBIDDEN
                    message: User does not own the property.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '404':
          description: Property not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                404_property_update_missing:
                  value:
                    code: NOT_FOUND
                    message: Property not found.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                422_property_update_invalid:
                  value:
                    code: VALIDATION_ERROR
                    message: Request validation failed.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
  /api/v1/properties/{propertyId}/photos:
    post:
      operationId: addPropertyPhoto
      summary: Attach an uploaded photo to a property
      description: Links a previously uploaded storage asset to a host-owned listing.
        The upload itself is performed through the storage service using the upload
        contract.
      tags:
      - Properties
      - Media
      security: *id003
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - assetId
              properties:
                assetId:
                  type: string
                caption:
                  type: string
                  maxLength: 200
                  nullable: true
            examples:
              201_property_photo_success:
                value:
                  assetId: asset-1001
                  caption: Room view
              422_property_photo_invalid:
                value:
                  assetId: ''
      responses:
        '201':
          description: Photo attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyPhoto'
              examples:
                201_property_photo_success:
                  value:
                    id: photo-1001
                    assetUrl: https://storage.example.com/staylocal/photo-1001.jpg
                    caption: Room view
                    isVerificationPhoto: false
                    createdAt: '2026-09-28T12:00:00Z'
        '401':
          description: Authentication token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                401_property_photo_unauthorized:
                  value:
                    code: UNAUTHORIZED
                    message: Authentication token is missing or invalid.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '403':
          description: User does not own the property.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                403_property_photo_forbidden:
                  value:
                    code: FORBIDDEN
                    message: User does not own the property.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '404':
          description: Property or asset not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                404_property_photo_missing:
                  value:
                    code: NOT_FOUND
                    message: Property or asset not found.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '422':
          description: Invalid asset attachment request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                422_property_photo_invalid:
                  value:
                    code: VALIDATION_ERROR
                    message: Invalid asset attachment request.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
  /api/v1/properties/{propertyId}/verification:
    post:
      operationId: verifyPropertyLocation
      summary: Verify host device proximity with camera + GPS
      description: Records the captured room photo asset, GPS coordinates, capture
        time and calculated Haversine distance. The server awards Location Verified
        only when distance is at most 50 meters; demo simulation modes are permitted
        for non-production environments.
      tags:
      - Verification
      security: *id003
      parameters:
      - name: propertyId
        in: path
        required: true
        schema:
          type: string
        examples:
          200_verification_success:
            value: prop-1001
          404_verification_missing_property:
            value: prop-missing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - photoAssetId
              - capturedLatitude
              - capturedLongitude
              - capturedAt
              - mode
              properties:
                photoAssetId:
                  type: string
                capturedLatitude:
                  type: number
                  minimum: -90
                  maximum: 90
                capturedLongitude:
                  type: number
                  minimum: -180
                  maximum: 180
                accuracyMeters:
                  type: number
                  minimum: 0
                  nullable: true
                capturedAt:
                  type: string
                  format: date-time
                mode:
                  type: string
                  enum:
                  - LIVE
                  - SIMULATED_AT_PROPERTY
                  - SIMULATED_AWAY
            examples:
              200_verification_success:
                value:
                  photoAssetId: asset-verify-1001
                  capturedLatitude: 19.0731
                  capturedLongitude: 73.5356
                  accuracyMeters: 8.5
                  capturedAt: '2026-09-28T12:05:00Z'
                  mode: LIVE
              200_verification_rejected:
                value:
                  photoAssetId: asset-verify-1002
                  capturedLatitude: 19.09
                  capturedLongitude: 73.56
                  accuracyMeters: 15.0
                  capturedAt: '2026-09-28T12:06:00Z'
                  mode: SIMULATED_AWAY
      responses:
        '200':
          description: Verification evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationResult'
              examples:
                200_verification_success:
                  value:
                    status: VERIFIED
                    distanceMeters: 7.3
                    thresholdMeters: 50
                    capturedLatitude: 19.0731
                    capturedLongitude: 73.5356
                    propertyLatitude: 19.0731
                    propertyLongitude: 73.5356
                    accuracyMeters: 8.5
                    capturedAt: '2026-09-28T12:05:00Z'
                    photoAssetId: asset-verify-1001
                    mode: LIVE
                    disclaimer: GPS proximity verifies device location at capture
                      time; it does not independently guarantee room condition.
        '401':
          description: Authentication token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                401_verification_unauthorized:
                  value:
                    code: UNAUTHORIZED
                    message: Authentication token is missing or invalid.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '403':
          description: User does not own the property.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                403_verification_forbidden:
                  value:
                    code: FORBIDDEN
                    message: User does not own the property.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '404':
          description: Property or photo asset not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                404_verification_missing_property:
                  value:
                    code: NOT_FOUND
                    message: Property or photo asset not found.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '422':
          description: Verification payload is invalid or simulation is not allowed
            in the current environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                422_verification_invalid:
                  value:
                    code: VERIFICATION_INVALID
                    message: Verification payload is invalid or simulation is not
                      allowed in the current environment.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
