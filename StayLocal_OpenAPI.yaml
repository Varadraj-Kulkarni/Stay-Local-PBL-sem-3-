              examples:
                403_admin_host_status_forbidden:
                  value:
                    code: FORBIDDEN
                    message: Admin role required.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '404':
          description: Host not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                404_admin_host_status_missing:
                  value:
                    code: NOT_FOUND
                    message: Host not found.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
        '422':
          description: Invalid host status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'
              examples:
                422_admin_host_invalid_status:
                  value:
                    code: VALIDATION_ERROR
                    message: Invalid host status.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
