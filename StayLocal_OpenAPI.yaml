  /api/v1/admin/hosts/{hostId}/status:
    patch:
      operationId: updateHostStatus
      summary: Approve or reject a host
      description: Admin-only action that changes host approval state. Rejection may
        be accompanied by an admin note.
      tags:
      - Admin
      security: *id003
      parameters:
      - name: hostId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - APPROVED
                  - REJECTED
                note:
                  type: string
                  maxLength: 1000
                  nullable: true
            examples:
              200_admin_host_approved:
                value:
                  status: APPROVED
                  note: Identity and profile reviewed.
              422_admin_host_invalid_status:
                value:
                  status: PENDING
      responses:
        '200':
          description: Host status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostProfile'
