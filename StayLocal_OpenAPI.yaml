                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
                  page:
                    type: integer
                  pageSize:
                    type: integer
                  total:
                    type: integer
              examples:
                200_bookings_success:
                  value:
                    items:
                    - &id006
                      id: book-1001
                      propertyId: prop-1001
                      touristId: 10000000-0000-4000-8000-000000000001
                      checkIn: '2026-10-10'
                      checkOut: '2026-10-12'
                      guests: 2
                      nightCount: 2
                      subtotal: 3600
                      discount: 100
                      total: 3500
                      couponCode: STAY100-AB12CD
                      status: CONFIRMED
                      paymentMethod: UPI_QR
                      createdAt: '2026-09-28T12:00:00Z'
                      confirmedAt: '2026-09-28T12:01:00Z'
                    page: 1
                    pageSize: 12
                    total: 1
