components:
  schemas:
    StandardError:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
          example: BOOKING_CONFLICT
        message:
          type: string
          example: The selected dates are already booked.
        requestId:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        details:
          type: object
          additionalProperties: true
          nullable: true
      example:
        code: BOOKING_CONFLICT
        message: The selected dates are already booked.
        requestId: 11111111-1111-4111-8111-111111111111
        details:
          propertyId: prop-1001
    User:
      type: object
      required:
      - id
      - email
      - fullName
      - role
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 254
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          maxLength: 20
          nullable: true
        role:
          type: string
          enum:
          - TOURIST
          - HOST
          - ADMIN
        createdAt:
          type: string
          format: date-time
      example: *id008
    AuthResponse:
      type: object
      required:
      - accessToken
      - user
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.demo
        expiresInSeconds:
          type: integer
          minimum: 60
          example: 3600
        user:
          $ref: '#/components/schemas/User'
      example: *id002
    Destination:
      type: object
      required:
      - id
      - name
      - slug
      - latitude
      - longitude
      - description
      properties:
        id:
          type: string
          example: dest-bhimashankar
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        description:
          type: string
          maxLength: 2000
        imageUrl:
          type: string
          format: uri
          nullable: true
      example: *id004
    HostProfile:
      type: object
      required:
      - id
      - userId
      - displayName
      - approvalStatus
      properties:
        id:
          type: string
          example: host-1001
        userId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        bio:
          type: string
          maxLength: 2000
          nullable: true
        approvalStatus:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
        verifiedAt:
          type: string
          format: date-time
          nullable: true
      example: *id007
    Property:
      type: object
      required:
      - id
      - hostId
      - destinationId
      - title
      - description
      - pricePerNight
      - maxGuests
      - status
      - latitude
      - longitude
      - locationVerified
      - createdAt
      properties:
        id:
          type: string
          example: prop-1001
        hostId:
          type: string
          example: host-1001
        destinationId:
          type: string
          example: dest-bhimashankar
        title:
          type: string
          minLength: 3
          maxLength: 160
        description:
          type: string
          minLength: 20
          maxLength: 5000
        pricePerNight:
          type: number
          minimum: 1
          maximum: 100000
          example: 1800
        maxGuests:
          type: integer
          minimum: 1
          maximum: 20
          example: 3
        amenities:
          type: array
          items:
            type: string
            maxLength: 80
          maxItems: 30
        photos:
          type: array
          items:
            $ref: '#/components/schemas/PropertyPhoto'
          maxItems: 20
        status:
          type: string
          enum:
          - DRAFT
          - PENDING
          - APPROVED
          - REJECTED
          - INACTIVE
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        locationVerified:
          type: boolean
        verification:
          $ref: '#/components/schemas/VerificationResult'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example: *id005
    PropertyPhoto:
      type: object
      required:
      - id
      - assetUrl
      - isVerificationPhoto
      - createdAt
      properties:
        id:
          type: string
          example: photo-1001
        assetUrl:
          type: string
          format: uri
        caption:
          type: string
          maxLength: 200
          nullable: true
        isVerificationPhoto:
          type: boolean
        createdAt:
          type: string
          format: date-time
    VerificationResult:
      type: object
      required:
      - status
      - distanceMeters
      - thresholdMeters
      - capturedLatitude
      - capturedLongitude
      - propertyLatitude
      - propertyLongitude
      - capturedAt
      - mode
      - disclaimer
      properties:
        status:
          type: string
          enum:
          - VERIFIED
          - REJECTED
        distanceMeters:
          type: number
          minimum: 0
        thresholdMeters:
          type: number
          minimum: 1
          example: 50
        capturedLatitude:
          type: number
          minimum: -90
          maximum: 90
        capturedLongitude:
          type: number
          minimum: -180
          maximum: 180
        propertyLatitude:
          type: number
          minimum: -90
          maximum: 90
        propertyLongitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          minimum: 0
          nullable: true
        capturedAt:
          type: string
          format: date-time
        photoAssetId:
          type: string
        mode:
          type: string
          enum:
          - LIVE
          - SIMULATED_AT_PROPERTY
          - SIMULATED_AWAY
        disclaimer:
          type: string
          example: GPS proximity verifies device location at capture time; it does
            not independently guarantee room condition.
    Booking:
      type: object
      required:
      - id
      - propertyId
      - touristId
      - checkIn
      - checkOut
      - guests
      - nightCount
      - subtotal
      - discount
      - total
      - status
      - paymentMethod
      - createdAt
      properties:
        id:
          type: string
          example: book-1001
        propertyId:
          type: string
          example: prop-1001
        touristId:
          type: string
          format: uuid
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        guests:
          type: integer
          minimum: 1
          maximum: 20
        nightCount:
          type: integer
          minimum: 1
        subtotal:
          type: number
          minimum: 0
        discount:
          type: number
          minimum: 0
        total:
          type: number
          minimum: 0
        couponCode:
          type: string
          maxLength: 40
          nullable: true
        status:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - CANCELLED
          - COMPLETED
        paymentMethod:
          type: string
          enum:
          - UPI_QR
          - DEMO_CARD
          - PAY_AT_STAY
        createdAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
          nullable: true
      example: *id006
    BookingVoucher:
      type: object
      required:
      - booking
      - verificationCode
      properties:
        booking:
          $ref: '#/components/schemas/Booking'
        verificationCode:
          type: string
          pattern: ^SL-[A-Z0-9]{8}$
        hostContact:
          type: string
          nullable: true
        qrPayload:
          type: string
      example: *id009
    RewardCoupon:
      type: object
      required:
      - id
      - code
      - amount
      - currency
      - status
      - issuedForBookingId
      - createdAt
      properties:
        id:
          type: string
          example: rew-1001
        code:
          type: string
          pattern: ^STAY100-[A-Z0-9]{6}$
        amount:
          type: number
          minimum: 0
          example: 100
        currency:
          type: string
          enum:
          - INR
        status:
          type: string
          enum:
          - AVAILABLE
          - REDEEMED
          - EXPIRED
        issuedForBookingId:
          type: string
        redeemedOnBookingId:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      example: *id010
    Review:
      type: object
      required:
      - id
      - propertyId
      - touristId
      - rating
      - comment
      - createdAt
      properties:
        id:
          type: string
          example: rev-1001
        propertyId:
          type: string
        touristId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          minLength: 3
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
    UploadInit:
      type: object
      required:
      - assetId
      - uploadUrl
      - expiresAt
      properties:
        assetId:
          type: string
          example: asset-1001
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    PaginatedProperties:
      type: object
      required:
      - items
      - page
      - pageSize
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Property'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
