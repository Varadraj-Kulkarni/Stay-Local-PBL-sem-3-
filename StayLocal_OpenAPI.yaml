                    message: Authentication token is missing or invalid.
                    requestId: 11111111-1111-4111-8111-111111111111
                    details: {}
    post:
      operationId: createBooking
      summary: Create a booking
      description: Creates a booking after server-side date, guest, price and overlap
        validation. A booking can include an available ₹100 reward coupon from a prior
        booking.
      tags:
      - Bookings
      security: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - propertyId
              - checkIn
              - checkOut
              - guests
              - paymentMethod
              properties:
                propertyId:
                  type: string
                checkIn:
                  type: string
                  format: date
                checkOut:
                  type: string
                  format: date
                guests:
                  type: integer
                  minimum: 1
                  maximum: 20
                couponCode:
                  type: string
                  maxLength: 40
                  nullable: true
                paymentMethod:
                  type: string
                  enum:
                  - UPI_QR
                  - DEMO_CARD
                  - PAY_AT_STAY
            examples:
              201_booking_success:
                value:
                  propertyId: prop-1001
                  checkIn: '2026-10-10'
                  checkOut: '2026-10-12'
                  guests: 2
                  couponCode: STAY100-AB12CD
                  paymentMethod: UPI_QR
              409_booking_overlap:
                value:
                  propertyId: prop-1001
                  checkIn: '2026-10-11'
                  checkOut: '2026-10-13'
                  guests: 2
                  paymentMethod: PAY_AT_STAY
